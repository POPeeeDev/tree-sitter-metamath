[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-metamath"
description = "Tree-sitter grammar for Metamath proof language"
version = "1.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "metamath"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "POPeeeDev" }]
requires-python = ">=3.10"
license.text = "CC0-1.0"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/POPeeeDev/tree-sitter-metamath"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
