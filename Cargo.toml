[package]
name = "tree-sitter-metamath"
description = "Tree-sitter grammar and parser for the Metamath proof language"
version = "1.0.1"
authors = [ "POPeeeDev", "m4dh0rs3" ]
license = "CC0-1.0"
# readme = "README.md"
keywords = [ "tree-sitter", "parsing", "metamath", "theorem-prover", "mathematics" ]
categories = [ "parser-implementations", "parsing", "text-editors" ]
repository = "https://github.com/popeeedev/tree-sitter-metamath"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
